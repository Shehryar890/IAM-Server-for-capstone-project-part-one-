spring:
  application:
    name: IAM-SERVER

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
   hibernate:
     ddl-auto: none
  open-in-view: false



  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 9090